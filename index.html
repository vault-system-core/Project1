<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Vault | Secure Edition</title>
  <!-- Security & Scanning Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap');
    
    :root {
      --bg: #050505;
      --glass: rgba(20, 20, 25, 0.6);
      --glass-border: rgba(255, 255, 255, 0.1);
      --neon: #00f3ff;
      --neon-glow: 0 0 15px rgba(0, 243, 255, 0.4);
      --danger: #ff003c;
      --text: #ffffff;
      --text-muted: #888;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }

    /* --- 3D Intro Sequence --- */
    #intro-screen {
      position: fixed; inset: 0; z-index: 999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
      perspective: 1000px;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    .vault-door {
      width: 300px; height: 300px;
      border: 2px solid var(--glass-border);
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--glass);
      backdrop-filter: blur(10px);
      transform-style: preserve-3d;
      transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1);
      box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
    }
    .vault-door.open { transform: rotateY(105deg) translateZ(100px); opacity: 0; }
    .vault-door h1 { font-size: 1.5rem; letter-spacing: 3px; color: var(--neon); text-shadow: var(--neon-glow); margin-bottom: 20px; }
    
    .pin-input {
      background: transparent; border: none; border-bottom: 2px solid var(--neon);
      color: var(--text); font-size: 1.5rem; text-align: center; width: 120px;
      outline: none; letter-spacing: 5px; margin-bottom: 20px; transition: border-color 0.3s;
    }
    .pin-input.error { border-bottom-color: var(--danger); }
    .btn {
      background: transparent; border: 1px solid var(--neon); color: var(--neon);
      padding: 10px 25px; border-radius: 4px; cursor: pointer; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase; transition: all 0.3s ease;
    }
    .btn:hover { background: var(--neon); color: #000; box-shadow: var(--neon-glow); }

    /* --- Main Dashboard (Glassmorphism) --- */
    #dashboard { display: none; max-width: 800px; margin: 0 auto; padding: 2rem 1rem; opacity: 0; transition: opacity 1s ease; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem; }
    header h2 { color: var(--neon); text-shadow: var(--neon-glow); font-weight: 300; }
    
    .glass-panel {
      background: var(--glass); border: 1px solid var(--glass-border);
      backdrop-filter: blur(15px); border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem;
    }

    /* Scanner HUD */
    #reader { width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--neon); }
    .hud-overlay { position: relative; }
    .hud-overlay::before, .hud-overlay::after {
      content: ''; position: absolute; width: 20px; height: 20px; border: 2px solid var(--neon); z-index: 10;
    }
    .hud-overlay::before { top: 10px; left: 10px; border-right: none; border-bottom: none; }
    .hud-overlay::after { bottom: 10px; right: 10px; border-left: none; border-top: none; }

    /* Form & Controls */
    input, select, textarea {
      width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 15px;
      background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border);
      color: var(--text); border-radius: 6px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--neon); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .data-card {
      background: rgba(20, 20, 25, 0.8); border: 1px solid var(--glass-border);
      border-radius: 10px; padding: 1.2rem; transition: transform 0.2s; position: relative;
    }
    .data-card:hover { transform: translateY(-3px); border-color: rgba(0, 243, 255, 0.3); }
    .badge { position: absolute; top: 1rem; right: 1rem; font-size: 0.7rem; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; letter-spacing: 1px; }
    .cat-medical { background: rgba(0, 255, 128, 0.1); color: #00ff80; border: 1px solid #00ff80; }
    .cat-warranty { background: rgba(0, 243, 255, 0.1); color: var(--neon); border: 1px solid var(--neon); }
    .card-title { font-size: 1.1rem; font-weight: 500; margin-bottom: 5px; width: 80%; }
    .card-date { font-size: 0.8rem; color: #ffae00; margin-bottom: 10px; }
    .card-data { font-size: 0.85rem; color: var(--text-muted); background: #000; padding: 8px; border-radius: 4px; word-break: break-all; }
    .delete-btn { background: none; border: none; color: var(--danger); cursor: pointer; margin-top: 10px; font-size: 0.8rem; }
  </style>
</head>
<body>

  <!-- 3D Entry Sequence -->
  <div id="intro-screen">
    <div class="vault-door" id="vaultDoor">
      <h1>SECURE VAULT</h1>
      <p style="font-size: 0.7rem; color: #888; margin-bottom: 10px;" id="pinStatus">ENTER MASTER PIN</p>
      <input type="password" id="masterPin" class="pin-input" maxlength="6" placeholder="•••" onkeypress="if(event.key === 'Enter') unlockVault()">
      <button class="btn" onclick="unlockVault()">DECRYPT</button>
    </div>
  </div>

  <!-- Main Dashboard -->
  <div id="dashboard">
    <header>
      <h2>SYSTEM.CORE</h2>
      <button class="btn" style="padding: 5px 15px; font-size: 0.8rem; border-color: var(--danger); color: var(--danger);" onclick="location.reload()">LOCK</button>
    </header>

    <div class="glass-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3>Scanner HUD</h3>
        <button id="scanBtn" class="btn" onclick="initScanner()">INITIALIZE CAMERA</button>
        <button id="stopBtn" class="btn" style="display:none; border-color: var(--danger); color: var(--danger);" onclick="stopScanner()">TERMINATE</button>
      </div>
      <div class="hud-overlay">
        <div id="reader"></div>
      </div>
    </div>

    <div id="entryForm" class="glass-panel" style="display: none; border-color: var(--neon);">
      <h3 style="color: var(--neon); margin-bottom: 10px;">ENCRYPT NEW RECORD</h3>
      <select id="entryCategory">
        <option value="warranty">Warranty / Guarantee</option>
        <option value="medical">Medical / Prescription</option>
      </select>
      <input type="text" id="entryTitle" placeholder="Identifier (e.g., Lenskart Rx)">
      <input type="date" id="entryDate">
      <textarea id="entryData" rows="3" placeholder="Extracted Payload..."></textarea>
      <button class="btn" style="width: 100%; background: var(--neon); color: #000;" onclick="saveEncryptedRecord()">ENCRYPT & STORE</button>
    </div>

    <div class="grid" id="vaultGrid"></div>
  </div>

  <script>
    let vaultPin = '';
    let html5QrCode = null;
    const STORAGE_KEY = 'vault_core_encrypted_v1';

    // --- Core Security Engine (AES-256) ---
    function unlockVault() {
      const input = document.getElementById('masterPin');
      const pin = input.value.trim();
      if(pin.length < 3) return triggerError(input);

      const rawData = localStorage.getItem(STORAGE_KEY);
      
      if (!rawData) {
        // First time setup
        vaultPin = pin;
        document.getElementById('pinStatus').innerText = "NEW VAULT CREATED";
        executeEntrySequence();
      } else {
        // Decrypt attempt
        try {
          const bytes = CryptoJS.AES.decrypt(rawData, pin);
          const decrypted = JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
          if(Array.isArray(decrypted)) {
            vaultPin = pin;
            executeEntrySequence();
            renderGrid(decrypted);
          } else { throw new Error('Bad Payload'); }
        } catch (e) {
          triggerError(input);
          document.getElementById('pinStatus').innerText = "DECRYPTION FAILED";
          document.getElementById('pinStatus').style.color = "var(--danger)";
        }
      }
    }

    function triggerError(el) {
      el.classList.add('error');
      setTimeout(() => el.classList.remove('error'), 1000);
      el.value = '';
    }

    function executeEntrySequence() {
      const door = document.getElementById('vaultDoor');
      const intro = document.getElementById('intro-screen');
      const dash = document.getElementById('dashboard');
      
      door.classList.add('open');
      setTimeout(() => {
        intro.style.opacity = '0';
        intro.style.visibility = 'hidden';
        dash.style.display = 'block';
        setTimeout(() => dash.style.opacity = '1', 50);
      }, 800);
    }

    function getDecryptedRecords() {
      const rawData = localStorage.getItem(STORAGE_KEY);
      if(!rawData) return [];
      const bytes = CryptoJS.AES.decrypt(rawData, vaultPin);
      return JSON.parse(bytes.toString(CryptoJS.enc.Utf8));
    }

    function saveSecurely(records) {
      const ciphertext = CryptoJS.AES.encrypt(JSON.stringify(records), vaultPin).toString();
      localStorage.setItem(STORAGE_KEY, ciphertext);
    }

    // --- UI & Logic ---
    function renderGrid(records) {
      const grid = document.getElementById('vaultGrid');
      grid.innerHTML = records.map(r => `
        <div class="data-card">
          <span class="badge cat-${r.category}">${r.category}</span>
          <div class="card-title">${escapeHtml(r.title)}</div>
          <div class="card-date">EXP: ${r.date || 'UNLIMITED'}</div>
          <div class="card-data">${escapeHtml(r.data)}</div>
          <button class="delete-btn" onclick="deleteRecord(${r.id})">PURGE RECORD</button>
        </div>
      `).join('');
    }

    function initScanner() {
      html5QrCode = new Html5Qrcode("reader");
      document.getElementById('scanBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';
      
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          stopScanner();
          document.getElementById('entryForm').style.display = 'block';
          document.getElementById('entryData').value = decodedText;
          autoParse(decodedText);
        },
        () => {} // Ignore frame errors
      );
    }

    function stopScanner() {
      if(html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('scanBtn').style.display = 'block';
          document.getElementById('stopBtn').style.display = 'none';
        }).catch(()=>{});
      }
    }

    function autoParse(text) {
      const t = text.toLowerCase();
      document.getElementById('entryCategory').value = (t.includes('rx') || t.includes('med')) ? 'medical' : 'warranty';
      document.getElementById('entryTitle').value = t.includes('lenskart') ? "Lenskart Authenticity" : "Scanned Payload";
      const dateMatch = text.match(/(\d{4}[-/]\d{2}[-/]\d{2})/);
      if(dateMatch) document.getElementById('entryDate').value = dateMatch[0].replace(/\//g, '-');
    }

    function saveEncryptedRecord() {
      const records = getDecryptedRecords();
      records.unshift({
        id: Date.now(),
        category: document.getElementById('entryCategory').value,
        title: document.getElementById('entryTitle').value || 'Untitled',
        date: document.getElementById('entryDate').value,
        data: document.getElementById('entryData').value
      });
      saveSecurely(records);
      document.getElementById('entryForm').style.display = 'none';
      renderGrid(records);
    }

    function deleteRecord(id) {
      saveSecurely(getDecryptedRecords().filter(r => r.id !== id));
      renderGrid(getDecryptedRecords());
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m]);
    }
  </script>
</body>
</html>
