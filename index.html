<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart QR Vault</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 1.5rem 1rem; }
    .container { max-width: 720px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 1.5rem; }
    h1 { font-size: 1.8rem; color: var(--accent); }
    p.subtitle { color: var(--text-dim); font-size: 0.9rem; }
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: var(--card-bg); padding: 0.4rem; border-radius: 10px; }
    .tab-btn { flex: 1; padding: 0.6rem; background: transparent; border: none; color: var(--text-dim); border-radius: 8px; font-weight: 600; cursor: pointer; }
    .tab-btn.active { background: var(--accent); color: #000; }
    .scanner-box { background: var(--card-bg); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; border: 1px solid var(--border); }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    .scanner-actions { display: flex; gap: 0.5rem; margin-top: 0.8rem; }
    button.btn { background: var(--accent); color: #000; font-weight: 600; border: none; border-radius: 6px; padding: 0.6rem 1rem; cursor: pointer; width: 100%; }
    button.btn-stop { background: var(--danger); color: #fff; }
    .entry-modal { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 1.2rem; margin-bottom: 1.5rem; display: none; }
    .entry-modal h3 { margin-bottom: 0.8rem; font-size: 1.1rem; }
    label { display: block; font-size: 0.8rem; color: var(--text-dim); margin-top: 0.6rem; }
    input, select, textarea { width: 100%; padding: 0.6rem; margin-top: 0.2rem; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
    .card-list { display: flex; flex-direction: column; gap: 1rem; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; position: relative; }
    .badge { display: inline-block; font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: bold; text-transform: uppercase; }
    .badge-warranty { background: rgba(56, 189, 248, 0.15); color: var(--accent); }
    .badge-medical { background: rgba(34, 197, 94, 0.15); color: var(--success); }
    .badge-offer { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
    .card-title { font-size: 1.1rem; margin-top: 0.4rem; }
    .card-date { font-size: 0.85rem; color: #f59e0b; margin-top: 0.3rem; }
    .card-body { font-size: 0.85rem; color: var(--text-dim); margin-top: 0.5rem; word-break: break-all; }
    .card-delete { position: absolute; top: 1rem; right: 1rem; background: transparent; border: none; color: var(--danger); font-size: 1.2rem; cursor: pointer; }
    .empty-state { text-align: center; color: var(--text-dim); padding: 2rem 0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>QR Vault</h1>
      <p class="subtitle">Secure offline vault for warranties, medical records & offers</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('all')">All Items</button>
      <button class="tab-btn" onclick="switchTab('warranty')">Warranties</button>
      <button class="tab-btn" onclick="switchTab('medical')">Medical</button>
      <button class="tab-btn" onclick="switchTab('offer')">Offers</button>
    </div>

    <div class="scanner-box">
      <div id="reader"></div>
      <div class="scanner-actions">
        <button id="scanBtn" class="btn" onclick="startScanner()">Open Scanner</button>
        <button id="stopBtn" class="btn btn-stop" style="display:none;" onclick="stopScanner()">Stop</button>
      </div>
    </div>

    <div id="entryModal" class="entry-modal">
      <h3>Store Scanned Entry</h3>
      <label>Category</label>
      <select id="entryCategory">
        <option value="warranty">Warranty / Guarantee (e.g., Lenskart, Electronics)</option>
        <option value="medical">Medical / Prescription (e.g., Medicine, Lab Test)</option>
        <option value="offer">Voucher / Expiring Offer</option>
      </select>

      <label>Title / Identifier</label>
      <input type="text" id="entryTitle" placeholder="e.g., Lenskart Eyewear, Medicine Prescriptions">

      <label>Expiry / Last Date</label>
      <input type="date" id="entryDate">

      <label>Extracted Details / Raw Payload</label>
      <textarea id="entryData" rows="3"></textarea>

      <button class="btn" style="margin-top:1rem;" onclick="saveEntry()">Save to Vault</button>
    </div>

    <div id="cardContainer" class="card-list"></div>
  </div>

  <script>
    let html5QrCode = null;
    let currentFilter = 'all';

    function getItems() {
      return JSON.parse(localStorage.getItem('qr_vault_records') || '[]');
    }

    function saveItems(items) {
      localStorage.setItem('qr_vault_records', JSON.stringify(items));
    }

    function renderCards() {
      const container = document.getElementById('cardContainer');
      const items = getItems();
      const filtered = currentFilter === 'all' ? items : items.filter(i => i.category === currentFilter);

      if (!filtered.length) {
        container.innerHTML = `<div class="empty-state">No entries logged in this category.</div>`;
        return;
      }

      container.innerHTML = filtered.map((item) => `
        <div class="card">
          <span class="badge badge-${item.category}">${item.category}</span>
          <button class="card-delete" onclick="deleteEntry(${item.id})">&times;</button>
          <div class="card-title">${escapeHtml(item.title)}</div>
          <div class="card-date">Valid / Expiry: <strong>${item.date || 'Indefinite'}</strong></div>
          <div class="card-body">${escapeHtml(item.data)}</div>
        </div>
      `).join('');
    }

    function switchTab(tab) {
      currentFilter = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderCards();
    }

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      document.getElementById('scanBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 250 } },
        (decodedText) => {
          stopScanner();
          handleScannedData(decodedText);
        },
        (errorMessage) => {}
      ).catch(err => {
        alert("Camera error: " + err);
        stopScanner();
      });
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          document.getElementById('scanBtn').style.display = 'block';
          document.getElementById('stopBtn').style.display = 'none';
        }).catch(() => {});
      }
    }

    function handleScannedData(text) {
      const modal = document.getElementById('entryModal');
      const dataField = document.getElementById('entryData');
      const titleField = document.getElementById('entryTitle');
      const dateField = document.getElementById('entryDate');

      modal.style.display = 'block';
      dataField.value = text;

      if (text.toLowerCase().includes('lenskart')) {
        titleField.value = "Lenskart Order / Warranty";
        document.getElementById('entryCategory').value = "warranty";
      } else if (text.toLowerCase().includes('rx') || text.toLowerCase().includes('med')) {
        titleField.value = "Prescription / Medicine";
        document.getElementById('entryCategory').value = "medical";
      } else {
        titleField.value = "Scan #" + Math.floor(Math.random() * 1000);
      }

      const dateMatch = text.match(/(\d{4}[-/]\d{2}[-/]\d{2})/);
      if (dateMatch) {
        dateField.value = dateMatch[0].replace(/\//g, '-');
      }
    }

    function saveEntry() {
      const items = getItems();
      const newEntry = {
        id: Date.now(),
        category: document.getElementById('entryCategory').value,
        title: document.getElementById('entryTitle').value || 'Untitled',
        date: document.getElementById('entryDate').value,
        data: document.getElementById('entryData').value
      };

      items.unshift(newEntry);
      saveItems(items);
      document.getElementById('entryModal').style.display = 'none';
      renderCards();
    }

    function deleteEntry(id) {
      const items = getItems().filter(item => item.id !== id);
      saveItems(items);
      renderCards();
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m]);
    }

    renderCards();
  </script>
</body>
</html>
